version: "3.8"

services:
  mysql_db:
    image: mysql:8.0
    container_name: business_center_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password_admin_123
      MYSQL_DATABASE: db_business_center
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
